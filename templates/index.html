<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>My GitHub Stars</title>

    <style>
        :root {
            color-scheme: light dark;

            --bg: #faf9f6;
            --ink: #1c1c1a;
            --ink-soft: #63615c;
            --ink-faint: #9c9a94;
            --line: #e3e0d8;
            --accent: #2b5d50;
            --accent-tint: #e7eeea;
            --surface-hover: #f1efe9;

            --font-sans:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;
            --font-serif:
                ui-serif,
                Georgia,
                Cambria,
                "Times New Roman",
                Times,
                serif;
            --font-mono:
                ui-monospace,
                "SFMono-Regular",
                Menlo,
                Consolas,
                "Liberation Mono",
                monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #17181a;
                --ink: #f2f1ed;
                --ink-soft: #a9a7a0;
                --ink-faint: #6e6c67;
                --line: #2c2d2f;
                --accent: #7cbba5;
                --accent-tint: rgba(124, 187, 165, 0.12);
                --surface-hover: #1f2022;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 56px 32px 80px;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            margin: 0 0 18px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .stat {
            margin: 0;
            display: flex;
            align-items: baseline;
            gap: 18px;
            flex-wrap: wrap;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--line);
        }

        .stat-number {
            font-family: var(--font-serif);
            font-size: 4rem;
            font-weight: 500;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .stat-label {
            font-size: 1rem;
            color: var(--ink-soft);
            max-width: 22ch;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0 32px;
        }

        .search-container {
            position: relative;
            flex: 1;
        }

        #search {
            width: 100%;
            padding: 12px 40px 12px 4px;
            font: inherit;
            font-size: 1.05rem;
            color: var(--ink);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            transition: border-color 120ms ease;
        }

        #search::placeholder {
            color: var(--ink-faint);
        }

        #search:focus {
            outline: none;
            border-bottom-color: var(--accent);
        }

        #search:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .search-hint {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            padding: 2px 7px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--ink-faint);
            border: 1px solid var(--line);
            border-radius: 5px;
            pointer-events: none;
        }

        .sort-toggle {
            flex-shrink: 0;
            padding: 10px 16px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            letter-spacing: 0.02em;
            color: var(--ink-soft);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            transition: border-color 120ms ease, color 120ms ease;
        }

        .sort-toggle:hover {
            color: var(--ink);
            border-color: var(--ink-soft);
        }

        .sort-toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 560px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 16px 14px;
            text-align: left;
            vertical-align: top;
            border-bottom: 1px solid var(--line);
        }

        th {
            position: sticky;
            top: 0;
            background: var(--bg);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-faint);
            border-bottom: 1px solid var(--ink-faint);
        }

        th:first-child,
        td:first-child {
            padding-left: 4px;
        }

        th:first-child {
            width: 26%;
        }

        th:last-child {
            width: 90px;
        }

        tbody tr {
            transition: background-color 120ms ease;
        }

        tbody tr:hover {
            background: var(--surface-hover);
        }

        .repo-name {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--ink);
            text-decoration: none;
        }

        .repo-name:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .repo-name:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        td:nth-child(2) {
            color: var(--ink-soft);
            font-size: 0.95rem;
        }

        .topics {
            margin-top: 9px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .topic {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--accent-tint);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.72rem;
        }

        .readme {
            white-space: nowrap;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .readme a {
            color: var(--accent);
        }

        .muted {
            color: var(--ink-faint);
            font-style: italic;
        }

        .no-results {
            padding: 48px 4px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--ink-faint);
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }

        @media (max-width: 700px) {
            main {
                padding: 32px 20px 56px;
            }

            .stat-number {
                font-size: 3rem;
            }

            .controls {
                flex-wrap: wrap;
            }

            .search-hint {
                display: none;
            }

            th,
            td {
                padding: 12px 8px;
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1>My GitHub Stars</h1>
            <p class="stat">
                <span class="stat-number">{{REPO_COUNT}}</span>
                <span class="stat-label">starred repositories, indexed and searchable</span>
            </p>
        </header>

        <div class="controls">
            <div class="search-container">
                <input
                    id="search"
                    type="search"
                    placeholder="Search repositories..."
                    autocomplete="off"
                    autofocus
                >
                <kbd class="search-hint">/</kbd>
            </div>
            <button id="sort-toggle" class="sort-toggle" type="button">Sort: A to Z</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Repository Description</th>
                        <th>README</th>
                    </tr>
                </thead>

                <tbody id="repositories">
                    {{REPO_ROWS}}
                </tbody>
            </table>
        </div>

        <p
            id="no-results"
            class="no-results"
            hidden
        >
            No matching repositories.
        </p>
    </main>

    <script>
        const input = document.getElementById("search");
        const sortToggle = document.getElementById("sort-toggle");
        const repoBody = document.getElementById("repositories");
        const originalOrder = Array.from(repoBody.querySelectorAll("tr"));
        const rows = originalOrder;
        const noResults = document.getElementById("no-results");
        let sortedAlphabetically = false;

        function search() {
            const query = input.value.trim().toLowerCase();
            let visible = 0;

            for (const row of rows) {
                const matches =
                    query === "" ||
                    row.dataset.search.includes(query);

                row.hidden = !matches;

                if (matches) {
                    visible++;
                }
            }

            noResults.hidden = visible !== 0;
        }

        function repoNameOf(row) {
            const el = row.querySelector(".repo-name");
            return (el ? el.textContent : "").trim().toLowerCase();
        }

        function toggleSort() {
            sortedAlphabetically = !sortedAlphabetically;

            if (sortedAlphabetically) {
                const sorted = rows.slice().sort((a, b) =>
                    repoNameOf(a).localeCompare(repoNameOf(b))
                );
                sorted.forEach((row) => repoBody.appendChild(row));
                sortToggle.textContent = "Sort: starred order";
            } else {
                originalOrder.forEach((row) => repoBody.appendChild(row));
                sortToggle.textContent = "Sort: A to Z";
            }
        }

        input.addEventListener("input", search);
        sortToggle.addEventListener("click", toggleSort);

        document.addEventListener("keydown", (event) => {
            if (event.key === "/" && document.activeElement !== input) {
                event.preventDefault();
                input.focus();
            }
        });
    </script>
</body>
</html>
